AWSTemplateFormatVersion: '2010-09-09'
Description: AWS Self-Service Platform - Network Stack

Parameters:
  VpcCidr:
    Type: String
    Default: 10.50.0.0/16

Resources:

  # 1. VPC
  SelfServiceVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: self-service-vpc

  # 2. Internet Gateway
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: self-service-igw

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref SelfServiceVPC
      InternetGatewayId: !Ref InternetGateway

  # 3. Public Subnets
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SelfServiceVPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.50.1.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: self-service-public-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SelfServiceVPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.50.2.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: self-service-public-b

  # 4. Private Subnets
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SelfServiceVPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.50.11.0/24
      Tags:
        - Key: Name
          Value: self-service-private-a

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SelfServiceVPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.50.12.0/24
      Tags:
        - Key: Name
          Value: self-service-private-b

  # 5. Public Route Table
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SelfServiceVPC
      Tags:
        - Key: Name
          Value: self-service-public-rt

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # 6. Private Route Table (no Internet route)
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SelfServiceVPC
      Tags:
        - Key: Name
          Value: self-service-private-rt

  PrivateSubnetARouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

Outputs:
  VpcId:
    Description: Self-Service VPC ID
    Value: !Ref SelfServiceVPC
    Export:
      Name: self-service-vpc-id

  PublicSubnetAId:
    Value: !Ref PublicSubnetA
    Export:
      Name: self-service-public-subnet-a

  PublicSubnetBId:
    Value: !Ref PublicSubnetB
    Export:
      Name: self-service-public-subnet-b

  PrivateSubnetAId:
    Value: !Ref PrivateSubnetA
    Export:
      Name: self-service-private-subnet-a

  PrivateSubnetBId:
    Value: !Ref PrivateSubnetB
    Export:
      Name: self-service-private-subnet-b